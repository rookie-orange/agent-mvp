<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯方块</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .game-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            background: #ffffff;
            border-radius: 0;
            padding: 30px;
            box-shadow: none;
            border: 2px solid #000000;
        }

        .game-board {
            position: relative;
        }

        canvas {
            border: 2px solid #000000;
            border-radius: 0;
            background: #ffffff;
            box-shadow: none;
        }

        .info-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 200px;
        }

        .info-section {
            background: #ffffff;
            border-radius: 0;
            padding: 20px;
            border: 2px solid #000000;
        }

        .info-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #000000;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 28px;
            font-weight: bold;
            color: #000000;
            text-align: center;
            font-family: 'Courier New', monospace;
        }

        .next-piece {
            background: #ffffff;
            border-radius: 0;
            padding: 10px;
            border: 2px solid #000000;
        }

        .controls {
            font-size: 14px;
            line-height: 1.8;
            color: #000000;
            font-family: 'Courier New', monospace;
            text-align: center;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffffff;
            color: #000000;
            padding: 40px;
            border-radius: 0;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            display: none;
            border: 2px solid #000000;
            box-shadow: none;
        }

        .restart-btn {
            background: #000000;
            color: #ffffff;
            border: 2px solid #000000;
            padding: 12px 24px;
            border-radius: 0;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .restart-btn:hover {
            background: #ffffff;
            color: #000000;
            transform: none;
            box-shadow: none;
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #000000;
            text-shadow: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Arial Black', sans-serif;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-board">
            <canvas id="gameCanvas" width="300" height="600"></canvas>
            <div id="gameOver" class="game-over">
                <div>游戏结束</div>
                <div id="finalScore"></div>
                <button class="restart-btn" onclick="restartGame()">重新开始</button>
            </div>
        </div>
        
        <div class="info-panel">
            <h1 class="title">俄罗斯方块</h1>
            
            <div class="info-section">
                <div class="info-title">得分</div>
                <div id="score" class="info-value">0</div>
            </div>
            
            <div class="info-section">
                <div class="info-title">等级</div>
                <div id="level" class="info-value">1</div>
            </div>
            
            <div class="info-section">
                <div class="info-title">已消除行数</div>
                <div id="lines" class="info-value">0</div>
            </div>
            
            <div class="info-section">
                <div class="info-title">下一个</div>
                <canvas id="nextCanvas" width="120" height="120" class="next-piece"></canvas>
            </div>
            
            <div class="info-section">
                <div class="info-title">操作说明</div>
                <div class="controls">
                    ← → 左右移动<br>
                    ↓ 快速下降<br>
                    ↑ 旋转方块<br>
                    空格 瞬间掉落<br>
                    P 暂停游戏
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');

        const BOARD_WIDTH = 10;
        const BOARD_HEIGHT = 20;
        const BLOCK_SIZE = 30;

        // 游戏状态
        let board = [];
        let currentPiece = null;
        let nextPiece = null;
        let score = 0;
        let level = 1;
        let lines = 0;
        let gameRunning = true;
        let isPaused = false;

        // 方块形状定义
        const PIECES = [
            // I形
            {
                shape: [
                    [1, 1, 1, 1]
                ],
                color: '#000000'
            },
            // O形
            {
                shape: [
                    [1, 1],
                    [1, 1]
                ],
                color: '#000000'
            },
            // T形
            {
                shape: [
                    [0, 1, 0],
                    [1, 1, 1]
                ],
                color: '#000000'
            },
            // S形
            {
                shape: [
                    [0, 1, 1],
                    [1, 1, 0]
                ],
                color: '#000000'
            },
            // Z形
            {
                shape: [
                    [1, 1, 0],
                    [0, 1, 1]
                ],
                color: '#000000'
            },
            // J形
            {
                shape: [
                    [1, 0, 0],
                    [1, 1, 1]
                ],
                color: '#000000'
            },
            // L形
            {
                shape: [
                    [0, 0, 1],
                    [1, 1, 1]
                ],
                color: '#000000'
            }
        ];

        // 初始化游戏板
        function initBoard() {
            board = [];
            for (let y = 0; y < BOARD_HEIGHT; y++) {
                board[y] = [];
                for (let x = 0; x < BOARD_WIDTH; x++) {
                    board[y][x] = 0;
                }
            }
        }

        // 创建新方块
        function createPiece() {
            const pieceType = PIECES[Math.floor(Math.random() * PIECES.length)];
            return {
                shape: pieceType.shape,
                color: pieceType.color,
                x: Math.floor(BOARD_WIDTH / 2) - Math.floor(pieceType.shape[0].length / 2),
                y: 0
            };
        }

        // 旋转方块
        function rotatePiece(piece) {
            const rotated = [];
            const rows = piece.shape.length;
            const cols = piece.shape[0].length;
            
            for (let i = 0; i < cols; i++) {
                rotated[i] = [];
                for (let j = 0; j < rows; j++) {
                    rotated[i][j] = piece.shape[rows - 1 - j][i];
                }
            }
            
            return {
                ...piece,
                shape: rotated
            };
        }

        // 检查碰撞
        function isValidMove(piece, dx, dy, newShape = null) {
            const shape = newShape || piece.shape;
            for (let y = 0; y < shape.length; y++) {
                for (let x = 0; x < shape[y].length; x++) {
                    if (shape[y][x]) {
                        const newX = piece.x + x + dx;
                        const newY = piece.y + y + dy;
                        
                        if (newX < 0 || newX >= BOARD_WIDTH || newY >= BOARD_HEIGHT) {
                            return false;
                        }
                        
                        if (newY >= 0 && board[newY][newX]) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        // 放置方块
        function placePiece(piece) {
            for (let y = 0; y < piece.shape.length; y++) {
                for (let x = 0; x < piece.shape[y].length; x++) {
                    if (piece.shape[y][x]) {
                        const boardY = piece.y + y;
                        const boardX = piece.x + x;
                        if (boardY >= 0) {
                            board[boardY][boardX] = piece.color;
                        }
                    }
                }
            }
        }

        // 消除完整行
        function clearLines() {
            let linesCleared = 0;
            
            for (let y = BOARD_HEIGHT - 1; y >= 0; y--) {
                if (board[y].every(cell => cell !== 0)) {
                    board.splice(y, 1);
                    board.unshift(new Array(BOARD_WIDTH).fill(0));
                    linesCleared++;
                    y++;
                }
            }
            
            if (linesCleared > 0) {
                lines += linesCleared;
                score += linesCleared * 100 * level;
                level = Math.floor(lines / 10) + 1;
                updateUI();
            }
        }

        // 绘制游戏
        function draw() {
            // 清空画布
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= BOARD_WIDTH; x++) {
                ctx.beginPath();
                ctx.moveTo(x * BLOCK_SIZE, 0);
                ctx.lineTo(x * BLOCK_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= BOARD_HEIGHT; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * BLOCK_SIZE);
                ctx.lineTo(canvas.width, y * BLOCK_SIZE);
                ctx.stroke();
            }
            
            // 绘制已放置的方块
            for (let y = 0; y < BOARD_HEIGHT; y++) {
                for (let x = 0; x < BOARD_WIDTH; x++) {
                    if (board[y][x]) {
                        drawBlock(ctx, x, y, board[y][x]);
                    }
                }
            }
            
            // 绘制当前方块
            if (currentPiece) {
                for (let y = 0; y < currentPiece.shape.length; y++) {
                    for (let x = 0; x < currentPiece.shape[y].length; x++) {
                        if (currentPiece.shape[y][x]) {
                            drawBlock(ctx, currentPiece.x + x, currentPiece.y + y, currentPiece.color);
                        }
                    }
                }
            }
            
            // 绘制下一个方块
            nextCtx.fillStyle = '#000';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            
            if (nextPiece) {
                const centerX = (nextCanvas.width - nextPiece.shape[0].length * 20) / 2;
                const centerY = (nextCanvas.height - nextPiece.shape.length * 20) / 2;
                
                for (let y = 0; y < nextPiece.shape.length; y++) {
                    for (let x = 0; x < nextPiece.shape[y].length; x++) {
                        if (nextPiece.shape[y][x]) {
                            drawNextBlock(nextCtx, centerX + x * 20, centerY + y * 20, nextPiece.color);
                        }
                    }
                }
            }
        }

        // 绘制方块
        function drawBlock(ctx, x, y, color) {
            const pixelX = x * BLOCK_SIZE;
            const pixelY = y * BLOCK_SIZE;
            
            // 主体 - 改为黑白配色
            ctx.fillStyle = '#000000';
            ctx.fillRect(pixelX + 1, pixelY + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
            
            // 高光 - 改为白色
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(pixelX + 1, pixelY + 1, BLOCK_SIZE - 2, 2);
            ctx.fillRect(pixelX + 1, pixelY + 1, 2, BLOCK_SIZE - 2);
            
            // 阴影
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(pixelX + BLOCK_SIZE - 3, pixelY + 1, 2, BLOCK_SIZE - 2);
            ctx.fillRect(pixelX + 1, pixelY + BLOCK_SIZE - 3, BLOCK_SIZE - 2, 2);
        }

        // 绘制下一个方块
        function drawNextBlock(ctx, x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, 18, 18);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.fillRect(x, y, 18, 2);
            ctx.fillRect(x, y, 2, 18);
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(x + 16, y, 2, 18);
            ctx.fillRect(x, y + 16, 18, 2);
        }

        // 更新UI
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lines').textContent = lines;
        }

        // 游戏循环
        function gameLoop() {
            if (!gameRunning || isPaused) return;
            
            if (currentPiece) {
                if (isValidMove(currentPiece, 0, 1)) {
                    currentPiece.y++;
                } else {
                    placePiece(currentPiece);
                    clearLines();
                    currentPiece = nextPiece;
                    nextPiece = createPiece();
                    
                    if (!isValidMove(currentPiece, 0, 0)) {
                        gameOver();
                        return;
                    }
                }
            }
            
            draw();
        }

        // 游戏结束
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = `最终得分: ${score}`;
            document.getElementById('gameOver').style.display = 'block';
        }

        // 重新开始
        function restartGame() {
            initBoard();
            currentPiece = createPiece();
            nextPiece = createPiece();
            score = 0;
            level = 1;
            lines = 0;
            gameRunning = true;
            isPaused = false;
            document.getElementById('gameOver').style.display = 'none';
            updateUI();
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (!gameRunning || isPaused) {
                if (e.key === 'p' || e.key === 'P') {
                    isPaused = !isPaused;
                    if (!isPaused) gameLoop();
                }
                return;
            }
            
            switch(e.key) {
                case 'ArrowLeft':
                    if (isValidMove(currentPiece, -1, 0)) {
                        currentPiece.x--;
                    }
                    break;
                case 'ArrowRight':
                    if (isValidMove(currentPiece, 1, 0)) {
                        currentPiece.x++;
                    }
                    break;
                case 'ArrowDown':
                    if (isValidMove(currentPiece, 0, 1)) {
                        currentPiece.y++;
                        score++;
                        updateUI();
                    }
                    break;
                case 'ArrowUp':
                    const rotated = rotatePiece(currentPiece);
                    if (isValidMove(currentPiece, 0, 0, rotated.shape)) {
                        currentPiece = rotated;
                    }
                    break;
                case ' ':
                    while (isValidMove(currentPiece, 0, 1)) {
                        currentPiece.y++;
                        score += 2;
                    }
                    updateUI();
                    break;
                case 'p':
                case 'P':
                    isPaused = true;
                    break;
            }
            
            draw();
        });

        // 初始化游戏
        initBoard();
        currentPiece = createPiece();
        nextPiece = createPiece();
        updateUI();
        draw();

        // 游戏主循环
        setInterval(() => {
            const speed = Math.max(50, 500 - (level - 1) * 50);
            if (Date.now() % speed < 16) {
                gameLoop();
            }
        }, 16);
    </script>
</body>
</html>
