<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯方块</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #ffffff;
            height: 100vh;
            overflow: hidden;
            color: #000000;
        }

        .game-wrapper {
            display: flex;
            height: 100vh;
            gap: 2px;
            background: #ffffff;
        }

        .game-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            position: relative;
            min-width: 0;
        }

        .game-board {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .game-title {
            font-size: 2.5rem;
            font-weight: bold;
            color: #000000;
            text-shadow: 1px 1px 2px rgba(128, 128, 128, 0.5);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        canvas {
            border: 2px solid #000000;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .side-panel {
            width: 320px;
            background: #f5f5f5;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            overflow-y: auto;
            border-left: 1px solid #cccccc;
        }

        .panel-section {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #000000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .score-display {
            font-size: 2.2rem;
            font-weight: bold;
            color: #000000;
            text-align: center;
            font-family: 'Courier New', monospace;
            text-shadow: 1px 1px 2px rgba(128, 128, 128, 0.3);
        }

        .level-lines {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .mini-display {
            text-align: center;
        }

        .mini-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #000000;
            font-family: 'Courier New', monospace;
        }

        .mini-label {
            font-size: 0.9rem;
            color: #555555;
            margin-top: 2px;
        }

        .next-piece-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 140px;
        }

        .controls-section {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #333333;
        }

        .control-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 4px 0;
            border-bottom: 1px solid #cccccc;
        }

        .control-key {
            background: #333;
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.8rem;
        }

        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 8px;
        }

        .game-over-content {
            text-align: center;
            background: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            border: 2px solid #333;
        }

        .game-over-title {
            font-size: 2rem;
            font-weight: bold;
            color: #ff4444;
            margin-bottom: 15px;
        }

        .final-score {
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 25px;
        }

        .restart-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .game-wrapper {
                flex-direction: column;
            }
            
            .side-panel {
                width: 100%;
                height: 200px;
                flex-direction: row;
                padding: 15px;
                overflow-x: auto;
                overflow-y: hidden;
            }
            
            .panel-section {
                min-width: 200px;
                margin-right: 15px;
            }
            
            .game-title {
                font-size: 2rem;
            }
        }

        @media (max-width: 768px) {
            .side-panel {
                height: 180px;
                padding: 10px;
            }
            
            .panel-section {
                min-width: 150px;
                padding: 15px;
            }
            
            .score-display {
                font-size: 1.8rem;
            }
            
            .game-title {
                font-size: 1.5rem;
            }
            
            canvas {
                max-width: 90vw;
                max-height: 50vh;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="game-area">
            <div class="game-board">
                <h1 class="game-title">俄罗斯方块</h1>
                <canvas id="gameCanvas" width="400" height="800"></canvas>
                <div id="gameOver" class="game-over-overlay">
                    <div class="game-over-content">
                        <div class="game-over-title">游戏结束</div>
                        <div id="finalScore" class="final-score"></div>
                        <button class="restart-btn" onclick="restartGame()">重新开始</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="side-panel">
            <div class="panel-section">
                <div class="section-title">得分</div>
                <div id="score" class="score-display">0</div>
            </div>
            
            <div class="panel-section">
                <div class="level-lines">
                    <div class="mini-display">
                        <div id="level" class="mini-value">1</div>
                        <div class="mini-label">等级</div>
                    </div>
                    <div class="mini-display">
                        <div id="lines" class="mini-value">0</div>
                        <div class="mini-label">消除行数</div>
                    </div>
                </div>
            </div>
            
            <div class="panel-section">
                <div class="section-title">下一个</div>
                <div class="next-piece-container">
                    <canvas id="nextCanvas" width="120" height="120"></canvas>
                </div>
            </div>
            
            <div class="panel-section controls-section">
                <div class="section-title">操作说明</div>
                <div class="control-item">
                    <span>左右移动</span>
                    <span class="control-key">← →</span>
                </div>
                <div class="control-item">
                    <span>快速下降</span>
                    <span class="control-key">↓</span>
                </div>
                <div class="control-item">
                    <span>旋转方块</span>
                    <span class="control-key">↑</span>
                </div>
                <div class="control-item">
                    <span>瞬间掉落</span>
                    <span class="control-key">空格</span>
                </div>
                <div class="control-item">
                    <span>暂停游戏</span>
                    <span class="control-key">P</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');

        const BOARD_WIDTH = 10;
        const BOARD_HEIGHT = 20;
        const BLOCK_SIZE = 40;

        // 游戏状态
        let board = [];
        let currentPiece = null;
        let nextPiece = null;
        let score = 0;
        let level = 1;
        let lines = 0;
        let gameRunning = true;
        let isPaused = false;
        let lastDropTime = 0;
        let particles = []; // 破碎粒子数组

        // 粒子类
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8 - 2;
                this.size = Math.random() * 6 + 4;
                this.color = color;
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.01;
                this.gravity = 0.3;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.life -= this.decay;
                this.size *= 0.98;
            }

            draw() {
                if (this.life <= 0) return;
                
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                
                // 添加一些亮度变化
                ctx.fillStyle = 'rgba(255, 255, 255, ' + (this.life * 0.3) + ')';
                ctx.fillRect(this.x, this.y, this.size * 0.5, this.size * 0.5);
                
                ctx.restore();
            }

            isDead() {
                return this.life <= 0 || this.size <= 0.5;
            }
        }

        // 方块形状定义 - 使用黑白灰配色方案
        const PIECES = [
            // I形 - 深灰色
            {
                shape: [
                    [1, 1, 1, 1]
                ],
                color: '#333333'
            },
            // O形 - 黑色
            {
                shape: [
                    [1, 1],
                    [1, 1]
                ],
                color: '#000000'
            },
            // T形 - 中灰色
            {
                shape: [
                    [0, 1, 0],
                    [1, 1, 1]
                ],
                color: '#666666'
            },
            // S形 - 浅灰色
            {
                shape: [
                    [0, 1, 1],
                    [1, 1, 0]
                ],
                color: '#999999'
            },
            // Z形 - 深灰色
            {
                shape: [
                    [1, 1, 0],
                    [0, 1, 1]
                ],
                color: '#444444'
            },
            // J形 - 中灰色
            {
                shape: [
                    [1, 0, 0],
                    [1, 1, 1]
                ],
                color: '#777777'
            },
            // L形 - 浅灰色
            {
                shape: [
                    [0, 0, 1],
                    [1, 1, 1]
                ],
                color: '#aaaaaa'
            }
        ];

        // 初始化游戏板
        function initBoard() {
            board = [];
            for (let y = 0; y < BOARD_HEIGHT; y++) {
                board[y] = [];
                for (let x = 0; x < BOARD_WIDTH; x++) {
                    board[y][x] = 0;
                }
            }
        }

        // 创建新方块
        function createPiece() {
            const pieceType = PIECES[Math.floor(Math.random() * PIECES.length)];
            return {
                shape: pieceType.shape,
                color: pieceType.color,
                x: Math.floor(BOARD_WIDTH / 2) - Math.floor(pieceType.shape[0].length / 2),
                y: 0
            };
        }

        // 旋转方块
        function rotatePiece(piece) {
            const rotated = [];
            const rows = piece.shape.length;
            const cols = piece.shape[0].length;
            
            for (let i = 0; i < cols; i++) {
                rotated[i] = [];
                for (let j = 0; j < rows; j++) {
                    rotated[i][j] = piece.shape[rows - 1 - j][i];
                }
            }
            
            return {
                ...piece,
                shape: rotated
            };
        }

        // 检查碰撞
        function isValidMove(piece, dx, dy, newShape = null) {
            const shape = newShape || piece.shape;
            for (let y = 0; y < shape.length; y++) {
                for (let x = 0; x < shape[y].length; x++) {
                    if (shape[y][x]) {
                        const newX = piece.x + x + dx;
                        const newY = piece.y + y + dy;
                        
                        if (newX < 0 || newX >= BOARD_WIDTH || newY >= BOARD_HEIGHT) {
                            return false;
                        }
                        
                        if (newY >= 0 && board[newY][newX]) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        // 放置方块
        function placePiece(piece) {
            for (let y = 0; y < piece.shape.length; y++) {
                for (let x = 0; x < piece.shape[y].length; x++) {
                    if (piece.shape[y][x]) {
                        const boardY = piece.y + y;
                        const boardX = piece.x + x;
                        if (boardY >= 0) {
                            board[boardY][boardX] = piece.color;
                        }
                    }
                }
            }
        }

        // 消除完整行
        function clearLines() {
            let linesCleared = 0;
            let clearedRows = [];
            
            for (let y = BOARD_HEIGHT - 1; y >= 0; y--) {
                if (board[y].every(cell => cell !== 0)) {
                    // 记录要消除的行
                    clearedRows.push(y);
                    board.splice(y, 1);
                    board.unshift(new Array(BOARD_WIDTH).fill(0));
                    linesCleared++;
                    y++;
                }
            }
            
            if (linesCleared > 0) {
                // 创建破碎粒子效果
                createLineBreakParticles(clearedRows);
                lines += linesCleared;
                score += linesCleared * 100 * level;
                level = Math.floor(lines / 10) + 1;
                updateUI();
            }
        }

        // 创建行消除破碎粒子效果
        function createLineBreakParticles(clearedRows) {
            clearedRows.forEach(rowY => {
                for (let x = 0; x < BOARD_WIDTH; x++) {
                    if (board[rowY] && board[rowY][x]) {
                        const pixelX = x * BLOCK_SIZE + BLOCK_SIZE / 2;
                        const pixelY = rowY * BLOCK_SIZE + BLOCK_SIZE / 2;
                        const color = board[rowY][x];
                        
                        // 为每个方块创建多个粒子
                        for (let i = 0; i < 8; i++) {
                            particles.push(new Particle(pixelX, pixelY, color));
                        }
                    }
                }
            });
        }

        // 绘制游戏
        function draw() {
            // 清空画布
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= BOARD_WIDTH; x++) {
                ctx.beginPath();
                ctx.moveTo(x * BLOCK_SIZE, 0);
                ctx.lineTo(x * BLOCK_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= BOARD_HEIGHT; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * BLOCK_SIZE);
                ctx.lineTo(canvas.width, y * BLOCK_SIZE);
                ctx.stroke();
            }
            
            // 绘制已放置的方块
            for (let y = 0; y < BOARD_HEIGHT; y++) {
                for (let x = 0; x < BOARD_WIDTH; x++) {
                    if (board[y][x]) {
                        drawBlock(ctx, x, y, board[y][x]);
                    }
                }
            }
            
            // 绘制当前方块
            if (currentPiece) {
                for (let y = 0; y < currentPiece.shape.length; y++) {
                    for (let x = 0; x < currentPiece.shape[y].length; x++) {
                        if (currentPiece.shape[y][x]) {
                            drawBlock(ctx, currentPiece.x + x, currentPiece.y + y, currentPiece.color);
                        }
                    }
                }
            }
            
            // 更新和绘制粒子
            updateAndDrawParticles();
            
            // 绘制下一个方块
            nextCtx.fillStyle = '#000';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            
            if (nextPiece) {
                const centerX = (nextCanvas.width - nextPiece.shape[0].length * 20) / 2;
                const centerY = (nextCanvas.height - nextPiece.shape.length * 20) / 2;
                
                for (let y = 0; y < nextPiece.shape.length; y++) {
                    for (let x = 0; x < nextPiece.shape[y].length; x++) {
                        if (nextPiece.shape[y][x]) {
                            drawNextBlock(nextCtx, centerX + x * 20, centerY + y * 20, nextPiece.color);
                        }
                    }
                }
            }
        }

        // 绘制方块
        function drawBlock(ctx, x, y, color) {
            const pixelX = x * BLOCK_SIZE;
            const pixelY = y * BLOCK_SIZE;
            
            // 主体
            ctx.fillStyle = color;
            ctx.fillRect(pixelX + 1, pixelY + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
            
            // 高光
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fillRect(pixelX + 1, pixelY + 1, BLOCK_SIZE - 2, 4);
            ctx.fillRect(pixelX + 1, pixelY + 1, 4, BLOCK_SIZE - 2);
            
            // 阴影
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(pixelX + BLOCK_SIZE - 5, pixelY + 1, 4, BLOCK_SIZE - 2);
            ctx.fillRect(pixelX + 1, pixelY + BLOCK_SIZE - 5, BLOCK_SIZE - 2, 4);
        }

        // 绘制下一个方块
        function drawNextBlock(ctx, x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, 18, 18);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fillRect(x, y, 18, 3);
            ctx.fillRect(x, y, 3, 18);
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(x + 15, y, 3, 18);
            ctx.fillRect(x, y + 15, 18, 3);
        }

        // 更新UI
        function updateUI() {
            document.getElementById('score').textContent = score.toLocaleString();
            document.getElementById('level').textContent = level;
            document.getElementById('lines').textContent = lines;
        }

        // 游戏循环
        function gameLoop(currentTime) {
            if (!gameRunning) return;
            
            if (isPaused) {
                requestAnimationFrame(gameLoop);
                return;
            }
            
            const dropSpeed = Math.max(100, 800 - (level - 1) * 60);
            
            if (currentTime - lastDropTime > dropSpeed) {
                if (currentPiece) {
                    if (isValidMove(currentPiece, 0, 1)) {
                        currentPiece.y++;
                    } else {
                        placePiece(currentPiece);
                        clearLines();
                        currentPiece = nextPiece;
                        nextPiece = createPiece();
                        
                        if (!isValidMove(currentPiece, 0, 0)) {
                            gameOver();
                            return;
                        }
                    }
                }
                lastDropTime = currentTime;
            }
            
            draw();
            requestAnimationFrame(gameLoop);
        }

        // 游戏结束
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = `最终得分: ${score.toLocaleString()}`;
            document.getElementById('gameOver').style.display = 'flex';
        }

        // 重新开始
        function restartGame() {
            initBoard();
            currentPiece = createPiece();
            nextPiece = createPiece();
            score = 0;
            level = 1;
            lines = 0;
            gameRunning = true;
            isPaused = false;
            lastDropTime = 0;
            document.getElementById('gameOver').style.display = 'none';
            updateUI();
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            
            if (e.key === 'p' || e.key === 'P') {
                isPaused = !isPaused;
                return;
            }
            
            if (isPaused) return;
            
            switch(e.key) {
                case 'ArrowLeft':
                    if (isValidMove(currentPiece, -1, 0)) {
                        currentPiece.x--;
                    }
                    break;
                case 'ArrowRight':
                    if (isValidMove(currentPiece, 1, 0)) {
                        currentPiece.x++;
                    }
                    break;
                case 'ArrowDown':
                    if (isValidMove(currentPiece, 0, 1)) {
                        currentPiece.y++;
                        score++;
                        updateUI();
                    }
                    break;
                case 'ArrowUp':
                    const rotated = rotatePiece(currentPiece);
                    if (isValidMove(currentPiece, 0, 0, rotated.shape)) {
                        currentPiece = rotated;
                    }
                    break;
                case ' ':
                    e.preventDefault();
                    while (isValidMove(currentPiece, 0, 1)) {
                        currentPiece.y++;
                        score += 2;
                    }
                    updateUI();
                    break;
            }
            
            draw();
        });

        // 初始化游戏
        initBoard();
        currentPiece = createPiece();
        nextPiece = createPiece();
        updateUI();
        draw();

        // 开始游戏循环
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
